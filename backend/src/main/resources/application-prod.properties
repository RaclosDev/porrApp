# Perfil de producción (SPRING_PROFILES_ACTIVE=prod en el Dockerfile). Se suma a application.properties.

# La documentación de la API no se publica en producción.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# En producción solo el dominio oficial; localhost queda para desarrollo (application.properties).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://porra.raclos.es}
