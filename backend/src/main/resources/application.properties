# Spring Boot Properties - Porra Mundial 2026

# Server (la plataforma inyecta PORT)
server.port=${PORT:8080}
server.address=0.0.0.0

# Proxy inverso / Terminación SSL (Railway, Cloudflare)
server.forward-headers-strategy=framework
# Proxies que añaden un salto a X-Forwarded-For delante de la app (Railway: 1; con Cloudflare delante: 2).
# RateLimitingFilter toma la IP de ese salto; lo que mande el cliente antes no cuenta.
app.rate-limiting.trusted-proxy-hops=${RATE_LIMIT_TRUSTED_PROXY_HOPS:1}

# Database Config (Postgres en local y en producción)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/porra}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:localdevpassword}
spring.datasource.driver-class-name=org.postgresql.Driver
# Pool de conexiones: ajustable por entorno para los picos de partido.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:15}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION_MS:30000}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
# Las relaciones EAGER (equipos de un partido, partido de un pronóstico...) se cargan por lotes, no una a una.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Sin baseline automático: una base no vacía y sin historial de Flyway tiene que fallar, no marcarse como V1.
# Solo para adoptar a mano una base heredada: FLYWAY_BASELINE_ON_MIGRATE=true durante un arranque.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
# Sin out-of-order: producción ya tiene V33.1 aplicada y una base nueva la aplica en su orden.
# Cada migración nueva tiene que llevar una versión mayor que la última aplicada.

# Resilience4j Circuit Breaker
spring.cloud.compatibility-verifier.enabled=false
resilience4j.circuitbreaker.instances.sportsApi.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.sportsApi.slidingWindowSize=5
resilience4j.circuitbreaker.instances.sportsApi.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.sportsApi.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.sportsApi.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.sportsApi.waitDurationInOpenState=5m
resilience4j.circuitbreaker.instances.sportsApi.failureRateThreshold=50
resilience4j.circuitbreaker.instances.lolesportsApi.slidingWindowSize=5
resilience4j.circuitbreaker.instances.lolesportsApi.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.lolesportsApi.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.lolesportsApi.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.lolesportsApi.waitDurationInOpenState=5m
resilience4j.circuitbreaker.instances.lolesportsApi.failureRateThreshold=50
resilience4j.circuitbreaker.instances.tennisApi.slidingWindowSize=5
resilience4j.circuitbreaker.instances.tennisApi.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.tennisApi.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.tennisApi.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.tennisApi.waitDurationInOpenState=5m
resilience4j.circuitbreaker.instances.tennisApi.failureRateThreshold=50

# ESPN para la UFC (calendario y cartelera de cada velada): breaker propio para no cortar el fútbol.
resilience4j.circuitbreaker.instances.ufcApi.slidingWindowSize=5
resilience4j.circuitbreaker.instances.ufcApi.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.ufcApi.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.ufcApi.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.ufcApi.waitDurationInOpenState=5m
resilience4j.circuitbreaker.instances.ufcApi.failureRateThreshold=50

# lolesports.com (API no oficial). La clave por defecto es la publica que usa la propia web.
lolesports.api-key=${LOLESPORTS_API_KEY:0TvQnueqKa5mxJntVWt0w4LpLfEkrV1Ta8rQBb9Z}

# Caché en memoria acotada: tamaño máximo y caducidad para que no crezca sin límite.
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=5000,expireAfterWrite=10m

# Pasada completa con ESPN (API pública, sin clave): ayer, hoy, mañana y calendario.
# El marcador en directo lo actualiza aparte la pasada de app.sync.live-interval-ms (60 s por defecto).
app.sync.interval-ms=900000

# Calendario oficial de football-data.org, solo para numerar jornadas de liga. Vacío = desactivado.
app.football-data.token=${FOOTBALL_DATA_TOKEN:}

# Hilos de las tareas programadas: con el hilo único por defecto, la sincronización y el refresco
# de goleadores se esperan entre sí cuando ESPN tarda.
spring.task.scheduling.pool.size=12

# App Configuration
app.jwt.secret=${JWT_SECRET:}
# Avisos push (Web Push/VAPID). Sin claves, los recordatorios quedan desactivados.
app.push.vapid-public-key=${VAPID_PUBLIC_KEY:}
app.push.vapid-private-key=${VAPID_PRIVATE_KEY:}
app.push.vapid-subject=${VAPID_SUBJECT:https://porrapp.app}
# Dirección pública de la web: enlaces e imagen de las invitaciones.
app.public-base-url=${PUBLIC_BASE_URL:https://porrapp.app}
google.client.id=${GOOGLE_CLIENT_ID:498045926443-u02u6penjkggongduv26qlm7934449ee.apps.googleusercontent.com}

# CORS: dominio oficial y localhost para desarrollo. El perfil prod solo admite el dominio oficial (application-prod.properties).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://porrapp.app,http://localhost:5173,http://localhost:8080}

# Llaves de acceso: dominio al que quedan ligadas y orígenes desde los que se aceptan.
# En local: WEBAUTHN_RP_ID=localhost y WEBAUTHN_ORIGINS=http://localhost:5173.
app.webauthn.rp-id=${WEBAUTHN_RP_ID:porrapp.app}
app.webauthn.origins=${WEBAUTHN_ORIGINS:https://porrapp.app}

# HTTP Response Compression (GZIP)
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,text/xml,text/plain,application/xml
server.compression.min-response-size=1024

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,prometheus
# /actuator/prometheus solo responde con «Authorization: Bearer <METRICS_TOKEN>»; sin token configurado, a nadie.
app.metrics.token=${METRICS_TOKEN:}
management.endpoint.health.show-details=never
# Railway y Docker solo comprueban que la app responde: un fallo de ESPN no debe tumbar un despliegue.
management.endpoint.health.probes.enabled=true

# Optimización de arranque en contenedores
spring.jpa.open-in-view=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Encoding Configuration
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
spring.flyway.encoding=UTF-8

# Subida de imágenes (logos de liga y fotos de perfil). El límite real lo valida ImageProcessor (3 MB).
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
