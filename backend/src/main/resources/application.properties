# Spring Boot Properties - Porra Mundial 2026

# Server (PORT se inyecta por Render)
server.port=${PORT:8080}
server.address=0.0.0.0
admin.password=${ADMIN_PASSWORD:}

# Proxy inverso / Terminación SSL (Render, Cloudflare)
server.forward-headers-strategy=framework

# Database Config (Postgres en local y en producción)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/porra}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:localdevpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=false

# Resilience4j Circuit Breaker
spring.cloud.compatibility-verifier.enabled=false
resilience4j.circuitbreaker.instances.sportsApi.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.sportsApi.slidingWindowSize=5
resilience4j.circuitbreaker.instances.sportsApi.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.sportsApi.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.sportsApi.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.sportsApi.waitDurationInOpenState=5m
resilience4j.circuitbreaker.instances.sportsApi.failureRateThreshold=50

# Cache Config (In-memory simple cache)
spring.cache.type=simple
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for debugging at /h2-console)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Jackson (dates as ISO strings)
spring.jackson.serialization.write-dates-as-timestamps=false

# External API for sync (ESPN - free, no API key needed)
app.espn.scoreboard-url=https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard
app.sync.interval-ms=30000

# Silenciar errores de conexión cortada de Tomcat
logging.level.org.apache.catalina.core=FATAL
logging.level.org.apache.coyote=FATAL

# App Configuration
app.jwt.secret=${JWT_SECRET:}
app.admins=Admin,RaclosAdmin,Raclos
app.admin-emails=raclosdev@gmail.com,raclosnegocios@gmail.com

# CORS Configuration (Restringido por defecto a dominio oficial y localhost)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://porra.raclos.es,http://localhost:5173,http://localhost:8080}

# HTTP Response Compression (GZIP)
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,text/xml,text/plain,application/xml
server.compression.min-response-size=1024

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Optimización de arranque en contenedores (Render)
spring.jpa.open-in-view=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
