# Spring Boot Properties - Porra Mundial 2026

# Server (PORT se inyecta por Railway)
server.port=${PORT:8080}
admin.password=${ADMIN_PASSWORD:localdevpassword}

# Database Config (Soporta H2 local o Postgres en producción)
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/porra-mundial;DB_CLOSE_DELAY=-1}
spring.datasource.username=${PGUSER:sa}
spring.datasource.password=${PGPASSWORD:}
# Nota: driver-class-name se elimina para que Spring lo detecte solo por la URL

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
# spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
# spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=src/main/resources/db/migration/V1__init_new.sql

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=false

# Resilience4j Circuit Breaker
spring.cloud.compatibility-verifier.enabled=false
resilience4j.circuitbreaker.instances.sportsApi.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.sportsApi.slidingWindowSize=5
resilience4j.circuitbreaker.instances.sportsApi.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.sportsApi.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.sportsApi.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.sportsApi.waitDurationInOpenState=5m
resilience4j.circuitbreaker.instances.sportsApi.failureRateThreshold=50

# Redis Cache Config (Disabled for local dev unless specified)
spring.cache.type=simple
# spring.data.redis.host=localhost
# spring.data.redis.port=6379
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for debugging at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson (dates as ISO strings)
spring.jackson.serialization.write-dates-as-timestamps=false

# External API for sync (ESPN — free, no API key needed)
app.espn.scoreboard-url=https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard
app.sync.interval-ms=30000

# Silenciar errores de conexión cortada de Tomcat
logging.level.org.apache.catalina.core=FATAL
logging.level.org.apache.coyote=FATAL
# App Configuration
app.admins=Admin,RaclosAdmin,Raclos
app.admin-emails=raclosdev@gmail.com,raclosnegocios@gmail.com
