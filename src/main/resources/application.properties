# Spring Boot Properties - Porra Mundial 2026

# Server (PORT se inyecta por Railway)
server.port=${PORT:8080}
admin.password=${ADMIN_PASSWORD:localdevpassword}

# Database Config (Soporta H2 local o Postgres en producción)
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/porra-mundial;DB_CLOSE_DELAY=-1}
spring.datasource.username=${PGUSER:sa}
spring.datasource.password=${PGPASSWORD:}
# Nota: driver-class-name se elimina para que Spring lo detecte solo por la URL

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (for debugging at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson (dates as ISO strings)
spring.jackson.serialization.write-dates-as-timestamps=false

# External API for sync
app.worldcup-api.teams-url=https://worldcup26.ir/get/teams
app.worldcup-api.games-url=https://worldcup26.ir/get/games
app.sync.interval-ms=30000

app.sportsapi.key=3eafeeee-dc6a-4278-9609-29c1c2c43e8e
