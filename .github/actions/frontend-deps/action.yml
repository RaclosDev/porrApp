name: Dependencias del frontend
description: Node 22 y node_modules restaurado de la caché si el lockfile no ha cambiado (evita ~40 s de npm ci en cada job).
runs:
  using: composite
  steps:
    - name: Use Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Restore node_modules
      id: modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: frontend/node_modules
        key: node-modules-${{ runner.os }}-node22-${{ hashFiles('frontend/package-lock.json') }}
    - name: Install dependencies
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      working-directory: frontend
      run: npm ci
