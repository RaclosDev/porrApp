name: PorrApp CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Semanal: construye la imagen y pasa todo aunque nadie haya tocado el repo (dependencias, imágenes base).
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Los PR comparten grupo y cancelan revisiones antiguas. Cada ejecución fuera de PR tiene su
# propio grupo: GitHub descarta ejecuciones pendientes del mismo grupo incluso con cancel=false.
# Con jobs por áreas, descartar un push intermedio podría dejar sus cambios sin comprobar.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.diff.outputs.frontend }}
      backend: ${{ steps.diff.outputs.backend }}
      docker: ${{ steps.diff.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect changed areas
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # shell: bash activa pipefail; sin él un fallo del script quedaría oculto tras el tee.
        shell: bash
        run: bash .github/scripts/detect-changes.sh | tee -a "$GITHUB_OUTPUT"
      - name: Check Flyway migration numbering
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/check-migrations.sh

  # El frontend va en tres jobs en paralelo; `frontend-check` los resume y es el check que exige la rama.
  frontend-lint:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependencias del frontend
        uses: ./.github/actions/frontend-deps
      # Falla con vulnerabilidades altas o críticas; las moderadas las sigue Dependabot.
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Check formatting (Prettier)
        # Mismos ficheros que formatea lint-staged en el pre-commit.
        run: npx prettier --check "**/*.{ts,tsx,json,css,md}"
      - name: Run ESLint
        run: npm run lint
      # Ficheros, exports y dependencias sin uso.
      - name: Find unused code (knip)
        run: npm run knip

  frontend-unit:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependencias del frontend
        uses: ./.github/actions/frontend-deps
      - name: Run Vitest Tests with coverage
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          node -e "const t=require('./coverage/coverage-summary.json').total;
          const row=k=>'| '+k+' | '+t[k].pct+' % | '+t[k].covered+' / '+t[k].total+' |';
          console.log(['### Cobertura del frontend','','| | % | Cubierto |','| --- | --- | --- |',row('lines'),row('branches'),row('functions')].join('n'))" >> "$GITHUB_STEP_SUMMARY"

  frontend-e2e:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependencias del frontend
        uses: ./.github/actions/frontend-deps
      - name: Build Frontend
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        run: npm run test:e2e

  frontend-check:
    name: frontend-check
    needs: [changes, frontend-lint, frontend-unit, frontend-e2e]
    if: always() && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Todos los jobs del frontend deben pasar
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done

  # Los tests del backend van en 3 runners en paralelo (cada uno paga su arranque de Spring, pero con CPU propia);
  # `backend-test` junta la cobertura de ambos, aplica el mínimo y es el check que exige la rama.
  backend-shard:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml
      - name: Require Docker for PostgreSQL integration tests
        run: docker info > /dev/null
      - name: Test shard ${{ matrix.shard }}
        run: |
          # Reparto por tiempos medidos (.github/ci/backend-test-weights.txt).
          tests=$(bash ../.github/scripts/backend-shard.sh ${{ matrix.shard }} 3)
          echo "Clases: $tests"
          ./mvnw -B test-compile surefire:test -Dtest="$tests" -Dsurefire.failIfNoSpecifiedTests=false
      - name: Guardar datos de cobertura
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-${{ matrix.shard }}
          path: backend/target/jacoco.exec
          retention-days: 1

  backend-test:
    name: backend-test
    needs: [changes, backend-shard]
    if: always() && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Todos los grupos de tests deben pasar
        working-directory: .
        env:
          RESULT: ${{ needs.backend-shard.result }}
        run: '[ "$RESULT" = "success" ]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml
      - name: Descargar datos de cobertura
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: jacoco-*
          path: ${{ runner.temp }}/jacoco
      - name: Cobertura conjunta (mínimo exigido)
        run: |
          # Los .exec son flujos de sesiones: concatenados equivalen a una sola ejecución.
          mkdir -p target
          cat "$RUNNER_TEMP"/jacoco/*/jacoco.exec > target/jacoco.exec
          ./mvnw -B compile jacoco:report jacoco:check@coverage-floor
      - name: Coverage summary
        if: always()
        run: |
          awk -F, 'NR>1 {lm+=$8; lc+=$9; bm+=$6; bc+=$7} END {
            printf "### Cobertura del backend\n\n| | %% | Cubierto |\n| --- | --- | --- |\n";
            printf "| lines | %.1f %% | %d / %d |\n", 100*lc/(lm+lc), lc, lm+lc;
            printf "| branches | %.1f %% | %d / %d |\n", 100*bc/(bm+bc), bc, bm+bc }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

  # En paralelo con los tests: Railway espera a la CI antes de desplegar y construye esta misma imagen,
  # así que encadenarla detrás de los tests solo retrasaba el despliegue.
  docker-build:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
