name: CodeQL

# Análisis estático de seguridad del backend (Java) y del frontend (TypeScript). Las alertas
# aparecen en la pestaña Security del repositorio. No necesita compilar: build-mode none.
# En los PR solo se analiza el lenguaje cuya parte cambia; en main, el lunes y a mano, los dos.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Elegir lenguajes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      languages: ${{ steps.pick.outputs.languages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect changed areas
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: bash .github/scripts/detect-changes.sh | tee -a "$GITHUB_OUTPUT"
      - name: Pick languages
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          BACKEND: ${{ steps.diff.outputs.backend }}
          FRONTEND: ${{ steps.diff.outputs.frontend }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          # Si cambia este workflow, se analizan los dos para probarlo.
          if [ "$EVENT_NAME" = "pull_request" ] && git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qx '.github/workflows/codeql.yml'; then
            BACKEND=true; FRONTEND=true
          fi
          langs=()
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$BACKEND" = "true" ]; then langs+=('"java-kotlin"'); fi
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$FRONTEND" = "true" ]; then langs+=('"javascript-typescript"'); fi
          echo "languages=[$(IFS=,; echo "${langs[*]}")]" | tee -a "$GITHUB_OUTPUT"

  analyze:
    needs: changes
    if: needs.changes.outputs.languages != '[]'
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
